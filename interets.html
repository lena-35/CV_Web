<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <title>Loisirs - CV Lénaïg LE MOIGNE</title>
    <link href="style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope&family=Montserrat&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <nav>
            <a href="index.html" class="lien-icone">
                <img src="images/logo-llm.svg" alt="Logo Lénaïg LE MOIGNE" class="logo-llm">
            </a>

            <div class="burger-menu">
                <img src="images/burger-logo.png" alt="Menu" class="burger-icon">
            </div>

            <div class="menu">
                <a href="index.html">Accueil</a>
                <a href="competences.html">Compétences</a>
                <a href="experience-professionnelle.html">Expérience professionnelle</a>
                <a href="athlete-haut-niveau.html">Athlète de haut niveau</a>
                <a href="engagement-associatif.html">Engagement associatif</a>
                <a href="formation.html">Formation</a>
                <a href="interets.html" class="active">Intérêts</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="titre">
            <h1>Mes intérêts</h1>
        </section>

        <section class="parcours">
            <div class="blocks-parcours competences">
                <div class="liste-item loisirs">
                    <h3>Loisirs</h3>
                    <ul class="savoir no-hover">
                        <li>[Sport] Volleyball (Haut Niveau), Snowboard</li>
                        <li>[Livre] Littérature Fantastique</li>
                        <li>[Ciné] Action, Fantastique</li>
                        <li>[Voyages] Chine, Brésil, USA, Europe</li>
                    </ul>
                </div>
            </div>

            <div class="photos interets">
                <img src="images/snowboard.jpeg" alt="Photo montagne en snowboard"
                    onclick="document.getElementById('modal-snowboard').showModal()">
                <dialog id="modal-snowboard" onclick="this.close()">
                    <img src="images/snowboard.jpeg" alt="Photo montagne en snowboard">
                </dialog>

                <img src="images/los-angeles.jpeg" alt="Photo de Los Angeles"
                    onclick="document.getElementById('modal-losangeles').showModal()">
                <dialog id="modal-losangeles" onclick="this.close()">
                    <img src="images/los-angeles.jpeg" alt="Photo de Los Angeles">
                </dialog>

                <img src="images/panneau-vegas.jpeg" alt="Photo du panneau de Las Vegas"
                    onclick="document.getElementById('modal-panneauvegas').showModal()">
                <dialog id="modal-panneauvegas" onclick="this.close()">
                    <img src="images/panneau-vegas.jpeg" alt="Photo du panneau de Las Vegas">
                </dialog>

                <img src="images/grand-canyon-1.jpeg" alt="Photo du Grand Canyon"
                    onclick="document.getElementById('modal-grandcanyon').showModal()">
                <dialog id="modal-grandcanyon" onclick="this.close()">
                    <img src="images/grand-canyon-1.jpeg" alt="Photo du Grand Canyon">
                </dialog>

                <img src="images/san-francisco.jpeg" alt="Photo du pont de San Francisco"
                    onclick="document.getElementById('modal-sanfrancisco').showModal()">
                <dialog id="modal-sanfrancisco" onclick="this.close()">
                    <img src="images/san-francisco.jpeg" alt="Photo du pont de San Francisco">
                </dialog>

                <img src="images/colisee.jpeg" alt="Photo du colisée de Romes"
                    onclick="document.getElementById('modal-colisee').showModal()">
                <dialog id="modal-colisee" onclick="this.close()">
                    <img src="images/colisee.jpeg" alt="Photo du colisée de Romes">
                </dialog>


                <img src="images/new-york.jpeg" alt="Photo de Time Square à New York"
                    onclick="document.getElementById('modal-newyork').showModal()">
                <dialog id="modal-newyork" onclick="this.close()">
                    <img src="images/new-york.jpeg" alt="Photo de Time Square à New York">
                </dialog>


                <img src="images/fontaine.JPG" alt="Photo de la fontaine de Trevi"
                    onclick="document.getElementById('modal-fontaine').showModal()">
                <dialog id="modal-fontaine" onclick="this.close()">
                    <img src="images/fontaine.JPG" alt="Photo de la fontaine de Trevi">
                </dialog>


                <img src="images/las-vegas.JPG" alt="Photo d'immeubles à Las Vegas"
                    onclick="document.getElementById('modal-lasvegas').showModal()">
                <dialog id="modal-lasvegas" onclick="this.close()">
                    <img src="images/las-vegas.JPG" alt="Photo d'immeubles à Las Vegas">
                </dialog>



            </div>

        </section>

    </main>

    <footer>
        <a href="index.html" class="lien-icone">
            <img src="images/logo-llm.svg" alt="Logo Lénaïg LE MOIGNE" class="logo-llm">
        </a>
        <a href="https://fr.linkedin.com/in/lénaïg-le-moigne" target="_blank" class="lien-icone">
            <img src="images/logo-linkedin.svg" alt="Logo LinkedIn" class="logo-linkedin">
        </a>
    </footer>

    <script>
        const burger = document.querySelector('.burger-menu');
        const menuMobile = document.querySelector('.menu');
        burger.addEventListener('click', (e) => {
            e.stopPropagation();
            menuMobile.classList.toggle('active');
        });
        document.addEventListener('click', () => {
            menuMobile.classList.remove('active');
        });
    </script>

</body>

</html>
