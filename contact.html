    <script>
        const burger = document.querySelector('.burger-menu');
        const menuMobile = document.getElementById('menu-mobile');

        // Fonction unique pour basculer le menu
        function toggleMenu() {
            const estOuvert = burger.getAttribute('aria-expanded') === 'true';
            burger.setAttribute('aria-expanded', !estOuvert);
            menuMobile.classList.toggle('active');

            // Si le menu vient d'être ouvert, on déplace le focus sur le 1er lien
            if (!estOuvert) {
                // Trouve le premier lien à l'intérieur du menu ouvert
                const premierLien = menuMobile.querySelector('a');
                if (premierLien) {
                    // Petit délai (setTimeout) pour laisser le temps à la classe active d'être appliquée
                    setTimeout(() => {
                        premierLien.focus();
                    }, 100);
                }
            }
        }

        // Gestion du clic
        burger.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMenu();
        });

        // Gestion du clavier (Entrée et Espace)
        burger.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                toggleMenu();
            }
        });

        // Fermeture au clic extérieur
        document.addEventListener('click', (e) => {
            if (!burger.contains(e.target) && menuMobile.classList.contains('active')) {
                menuMobile.classList.remove('active');
                burger.setAttribute('aria-expanded', 'false');
            }
        });
    </script>

</body>
