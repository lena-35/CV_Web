    <script>
        const burger = document.querySelector('.burger-menu');
        const menuMobile = document.getElementById('menu-mobile');
        const nav = document.querySelector('header nav');
        const logo = document.querySelector('.lien-icone');

        function adaptMenu() {
            if (!nav || !menuMobile || !logo) return;

            nav.classList.remove('is-overflowing');

            const availableWidth = nav.clientWidth - logo.offsetWidth - 30;
            const requiredWidth = menuMobile.scrollWidth;

            if (requiredWidth > availableWidth) {
                nav.classList.add('is-overflowing');
            } else {
                nav.classList.remove('is-overflowing');
                menuMobile.classList.remove('active');
                if (burger) burger.setAttribute('aria-expanded', 'false');
            }
        }

        window.addEventListener('load', adaptMenu);
        window.addEventListener('resize', adaptMenu);

        function toggleMenu() {
            const estOuvert = burger.getAttribute('aria-expanded') === 'true';
            burger.setAttribute('aria-expanded', !estOuvert);
            menuMobile.classList.toggle('active');

            if (!estOuvert) {
                const premierLien = menuMobile.querySelector('a');
                if (premierLien) {
                    setTimeout(() => {
                        premierLien.focus();
                    }, 100);
                }
            }
        }

        if (burger) {
            burger.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleMenu();
            });

            burger.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleMenu();
                }
            });
        }

        // Clic en dehors du menu pour fermer
        document.addEventListener('click', (e) => {
            if (burger && !burger.contains(e.target) && menuMobile.classList.contains('active')) {
                menuMobile.classList.remove('active');
                burger.setAttribute('aria-expanded', 'false');
            }
        });

        // Touche Échap pour fermer le menu
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && menuMobile.classList.contains('active')) {
                menuMobile.classList.remove('active');
                if (burger) {
                    burger.setAttribute('aria-expanded', 'false');
                    burger.focus();
                }
            }
        });
    </script>

</body>

</html>
